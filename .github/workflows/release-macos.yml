name: Build macOS installer

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build, for example v0.5.3"
        required: true
      upload_to_release:
        description: "Upload pkg/dmg assets to the GitHub Release"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write

jobs:
  build:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build installer
        run: sh scripts/package_macos.sh --arch-name "${{ matrix.arch }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: korail-analyzer-macos-${{ matrix.arch }}
          path: |
            dist/installer/KorailAnalyzerInstaller-*-macos-${{ matrix.arch }}.pkg
            dist/installer/KorailAnalyzerInstaller-*-macos-${{ matrix.arch }}.dmg

      - name: Upload to GitHub Release
        if: inputs.upload_to_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          TAG="${{ inputs.tag }}"
          NOTES="docs/releases/$TAG.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --title "$TAG" --notes-file "$NOTES" || true
            else
              gh release create "$TAG" --title "$TAG" --notes "$TAG" || true
            fi
          fi
          gh release upload "$TAG" dist/installer/KorailAnalyzerInstaller-*-macos-${{ matrix.arch }}.* --clobber
