[project]
name = "korail-program"
version = "0.1.0"
description = "Offline Windows analyzer for catenary obstruction tree events in rail cab videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "opencv-python>=4.10",
    "pyside6>=6.7",
    "reportlab>=4.2",
]

[project.optional-dependencies]
ocr = [
    "paddleocr>=3.0",
]
inference = [
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
korail-analyzer = "korail_program.cli:main"
korail-analyzer-gui = "korail_program.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korail_program"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

