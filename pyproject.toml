[project]
name = "korail-program"
version = "0.6.2"
description = "Offline desktop analyzer for catenary obstruction tree events in rail cab videos."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "certifi>=2025.10.5",
    "pyside6>=6.7",
    "qtawesome>=1.4.2",
]

[project.optional-dependencies]
processing = [
    "opencv-python>=4.10",
]
reports = [
    "openpyxl>=3.1",
    "reportlab>=4.2",
]
ocr = [
    "paddleocr>=3.0",
]
inference = [
    "requests>=2.32",
]
full = [
    "opencv-python>=4.10",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "requests>=2.32",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
packaging = [
    "pyinstaller>=6.11",
]

[project.scripts]
korail-analyzer = "korail_program.cli:main"
korail-analyzer-gui = "korail_program.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korail_program"]

[tool.hatch.build.targets.wheel.force-include]
"src/korail_program/assets/fonts" = "korail_program/assets/fonts"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
